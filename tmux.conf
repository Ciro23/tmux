set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Enable mouse support.
set -g mouse on

# Start windows and panes at 1, not 0.
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows 1

# Auto-save all sessions every 15 minutes.
set -g @continuum-restore 'on'

# Restore the visible text in each pane, not just the layout.
set -g @resurrect-capture-pane-contents 'on'

# Auto-run processes when restoring the saved sessions.
set -g @resurrect-processes 'ssh psql claude "~npm run dev"'

# Machine-specific overrides (not tracked in git)
source-file -q ~/.config/tmux/local.conf

# Bootstrap TPM on a fresh machine (path must be set before install_plugins runs)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Keep this line at the very bottom of the file!
run '~/.config/tmux/plugins/tpm/tpm'
